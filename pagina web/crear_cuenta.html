<!DOCTYPE html>
  <html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear cuenta - Mi web</title>
  <style>
    body{
    background:#6660ad;
      
    }
    form {
          margin: 20px auto;
          padding: 20px;
          max-width: 500px;
          border: 1px solid #000000;
          border-radius: 30px;
          font-family:Arial, Helvetica, sans-serif;
        }
    label {
      display: block;
      margin-bottom: 10px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #000000;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    input[type="radio"], input[type="checkbox"] {
      margin-right: 5px;
    }
    input[type="submit"], button {
      background-color: #4CAF50;
      color: rgb(255, 255, 255);
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="radio"], input[type="checkbox"] {
      margin-right: 5px;
    }
   .cuadro1{
    background: #dbffdf;
   }
    input[type="submit"]:hover, button:hover {
      background-color: #45a049;
    }
    button {
      background-color: #f44336;
    }
    button:hover {
      background-color: #da190b;
    }
  </style>
</head>
<body>
    <h1>Crear cuenta de usuario</h1><br>
    <hr>

  <form method="GET" action="">
    <label for="nombre">Nombre:</label>
    <input class="cuadro1" type="text" id="nombre" name="nombre" maxlength="50" required>
    <label for="apellidos">Apellidos:</label>
    <input class="cuadro1" type="text" id="apellidos" name="apellidos" maxlength="50" required>
    <label for="sexo">Sexo:</label>
    <input type="radio" id="hombre" name="sexo" value="hombre" required>
    <label for="hombre">Hombre</label>
    <input type="radio" id="mujer" name="sexo" value="mujer" required>
    <label for="mujer">Mujer</label>
    <label for="correo">Correo electrónico:</label>
    <input class="cuadro1" type="text" id="correo" name="correo" required>
    <label for="Crear contraseña">Contraseña:</label>
    <input class="cuadro1" type="text" id="contraseña" name="contraseña" required>
    <input type="submit" value="Enviar">
  </form>
</body>
</html>
