    <script>
        $(document).ready(function() {
            $('.nav-link-ajax').click(function(e) {
                e.preventDefault(); // Evita que la página recargue o salte

                // Quitar la clase 'active' de todos los botones y ponérsela al presionado
                $('.nav-link-ajax').removeClass('active');
                $(this).addClass('active');

                // Obtener el nombre del archivo desde el atributo 'data-page'
                var pagina = $(this).data('page');

                // Cambiar el título del encabezado dinámicamente según la opción
                var textoMenu = $(this).text().trim();
                $('#seccion-titulo').text(textoMenu);

                // Hacer la petición AJAX para traer el contenido del archivo PHP externo
                $.ajax({
                    url: pagina,
                    type: 'GET',
                    success: function(data) {
                        // Insertar el contenido en el contenedor principal con un leve efecto de transición
                        $('#contenedor-dinamico').hide().html(data).fadeIn(300);
                    },
                    error: function() {
                        $('#contenedor-dinamico').html('<div class="alert alert-danger">Error al cargar la sección.</div>');
                    }
                });
            });
        });
    </script>
