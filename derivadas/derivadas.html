<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Análisis Numérico - Ingeniería</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <script src="https://unpkg.com/function-plot/dist/function-plot.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .dashboard {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .dashboard { grid-template-columns: 1fr; }
    }

    .panel-controls {
      background: var(--bg-card);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-graph {
      background: var(--bg-card);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    h2 { margin: 0 0 10px 0; font-size: 1.5rem; color: var(--accent); }
    p { margin: 0; color: #94a3b8; font-size: 0.9rem; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label { font-size: 0.85rem; font-weight: 600; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; }

    input[type="text"] {
      background: #0f172a;
      border: 2px solid #334155;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    input[type="text"]:focus { border-color: var(--accent); }

    .slider-container {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .slider-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-row { display: flex; gap: 10px; }

    button {
      flex: 1;
      padding: 12px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover { background: var(--accent-hover); transform: translateY(-1px); }
    
    button.btn-secondary {
      background: #334155;
      color: var(--text);
    }
    button.btn-secondary:hover { background: #475569; }

    /* Telemetría / Datos de ingeniería */
    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .telemetry-card {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    .telemetry-card.secant { border-left-color: #fbbf24; }
    .telemetry-card.taylor { border-left-color: #ec4899; }

    .telemetry-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    .telemetry-value { font-size: 1.1rem; font-weight: bold; font-family: monospace; margin-top: 4px; }

    #plot {
      width: 100%;
      height: 550px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    
    <div class="panel-controls">
      <div>
        <h2>⚙️ Ingeniería MatLab-Web</h2>
        <p>Cálculo diferencial y aproximaciones polinomiales</p>
      </div>

      <div class="input-group">
        <label for="funcion">Función Principal $f(x)$</label>
        <input type="text" id="funcion" value="cos(x) * x + 2">
        <button onclick="inicializarTodo()">Calcular y Analizar</button>
      </div>

      <div class="slider-container">
        <div class="slider-header">
          <label>Punto Evaluado ($x_0$)</label>
          <span id="valX0" style="font-family: monospace; color: var(--accent);">0.00</span>
        </div>
        <input type="range" id="sliderX0" min="-5" max="5" step="0.02" value="0">
      </div>

      <div class="slider-container">
        <div class="slider-header">
          <label>Delta de aproximación ($h$)</label>
          <span id="valH" style="font-family: monospace; color: #fbbf24;">1.00</span>
        </div>
        <input type="range" id="sliderH" min="0.01" max="2" step="0.01" value="1">
      </div>

      <div class="btn-row">
        <button id="btnPlay" class="btn-secondary" onclick="toggleAnimacion()">▶️ Animar $x_0$</button>
      </div>

      <hr style="border: 0; border-top: 1px solid #334155; margin: 5px 0;">

      <div>
        <label>Telemetría en tiempo real</label>
        <div class="telemetry-grid">
          <div class="telemetry-card">
            <div class="telemetry-label">Coordenadas P0</div>
            <div class="telemetry-value" id="telP0">(0, 0)</div>
          </div>
          <div class="telemetry-card">
            <div class="telemetry-label">Derivada f'(x₀)</div>
            <div class="telemetry-value" id="telDerivada">0.000</div>
          </div>
          <div class="telemetry-card secant">
            <div class="telemetry-label">Pendiente Secante</div>
            <div class="telemetry-value" id="telSecante">0.000</div>
          </div>
          <div class="telemetry-card taylor">
            <div class="telemetry-label">Curvatura f''(x₀)</div>
            <div class="telemetry-value" id="telDerivada2">0.000</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel-graph">
      <div id="plot"></div>
    </div>

  </div>

  <script>
    // Variables globales de cálculo
    let expr, derivada1, derivada2;
    let animacionID = null;
    let animando = false;
    let pasoAnimacion = 0.02;

    // Componentes del DOM
    const inputFuncion = document.getElementById("funcion");
    const sliderX0 = document.getElementById("sliderX0");
    const sliderH = document.getElementById("sliderH");

    function inicializarTodo() {
      try {
        const formula = inputFuncion.value;
        
        // Generar funciones analíticas usando Math.js (Simulación CAS de ingeniería)
        expr = math.compile(formula);
        derivada1 = math.compile(math.derivative(formula, 'x').toString());
        derivada2 = math.compile(math.derivative(math.derivative(formula, 'x'), 'x').toString());

        render();
      } catch (e) {
        alert("Error matemático en la expresión. Asegúrate de escribir funciones válidas (Ej: sin(x), x^3 - 2*x, exp(x))");
      }
    }

    function render() {
      if (!expr) return;

      const x0 = parseFloat(sliderX0.value);
      const h = parseFloat(sliderH.value);
      const x1 = x0 + h;

      document.getElementById("valX0").innerText = x0.toFixed(2);
      document.getElementById("valH").innerText = h.toFixed(2);

      // Evaluación numérica de alta precisión
      const y0 = expr.evaluate({ x: x0 });
      const y1 = expr.evaluate({ x: x1 });
      const d1 = derivada1.evaluate({ x: x0 });
      const d2 = derivada2.evaluate({ x: x0 });
      const mSec = (y1 - y0) / h;

      // Actualizar Telemetría
      document.getElementById("telP0").innerText = `(${x0.toFixed(2)}, ${y0.toFixed(2)})`;
      document.getElementById("telDerivada").innerText = d1.toFixed(3);
      document.getElementById("telSecante").innerText = mSec.toFixed(3);
      document.getElementById("telDerivada2").innerText = d2.toFixed(3);

      // --- Modelado de Funciones Secundarias ---
      // 1. Recta Tangente: y = d1*(x - x0) + y0
      const tangenteStr = `${d1} * (x - ${x0}) + ${y0}`;
      
      // 2. Recta Secante: y = mSec*(x - x0) + y0
      const secanteStr = `${mSec} * (x - ${x0}) + ${y0}`;

      // 3. Polinomio de Taylor Orden 2 (Parábola de curvatura): P(x) = f(x0) + f'(x0)(x-x0) + 0.5*f''(x0)(x-x0)^2
      const taylorStr = `${y0} + ${d1}*(x - ${x0}) + 0.5 * ${d2} * (x - ${x0})^2`;

      // Renderizado con FunctionPlot
      functionPlot({
        target: '#plot',
        width: 780,
        height: 550,
        grid: true,
        xAxis: { domain: [-5, 5] },
        yAxis: { domain: [-5, 8] },
        data: [
          { // Función Original
            fn: inputFuncion.value,
            color: '#0284c7',
            attr: { "stroke-width": 3 }
          },
          { // Recta Tangente (Verde)
            fn: tangenteStr,
            color: '#10b981',
            attr: { "stroke-width": 1.5 }
          },
          { // Recta Secante (Amarilla)
            fn: secanteStr,
            color: '#f59e0b',
            attr: { "stroke-dasharray": "5,5" }
          },
          { // Polinomio de Taylor de Grado 2 (Curvatura en Rosa)
            fn: taylorStr,
            color: '#ec4899',
            attr: { "stroke-width": 1, "stroke-dasharray": "2,2" }
          },
          { // Punto de Análisis P0
            points: [[x0, y0]],
            fnType: 'points',
            graphType: 'scatter',
            color: '#ef4444',
            attr: { r: 6 }
          },
          { // Punto Secante P1
            points: [[x1, y1]],
            fnType: 'points',
            graphType: 'scatter',
            color: '#f59e0b',
            attr: { r: 5 }
          }
        ],
        // Anotaciones vectoriales integradas (Líneas de proyección al eje)
        annotations: [
          { x: x0, text: `x₀ = ${x0.toFixed(1)}`, color: '#64748b' },
          { y: y0, text: `f(x₀)`, color: '#64748b' }
        ]
      });
    }

    // --- Sistema de Animación Automatizada ---
    function toggleAnimacion() {
      const btn = document.getElementById("btnPlay");
      if (animando) {
        cancelAnimationFrame(animacionID);
        btn.innerText = "▶️ Animar x₀";
        btn.classList.add("btn-secondary");
        animando = false;
      } else {
        btn.innerText = "⏸️ Pausar";
        btn.classList.remove("btn-secondary");
        animando = true;
        bucleAnimacion();
      }
    }

    function bucleAnimacion() {
      let actual = parseFloat(sliderX0.value);
      let max = parseFloat(sliderX0.max);
      let min = parseFloat(sliderX0.min);

      actual += pasoAnimacion;
      
      // Rebote al llegar a los límites del eje X
      if (actual >= max || actual <= min) {
        pasoAnimacion = -pasoAnimacion;
      }

      sliderX0.value = actual;
      render();

      if (animando) {
        animacionID = requestAnimationFrame(bucleAnimacion);
      }
    }

    // Listeners interactivos fluidos
    sliderX0.addEventListener('input', () => {
      if(animando) toggleAnimacion(); // Pausa si el usuario arrastra manualmente
      render();
    });
    sliderH.addEventListener('input', render);

    // Inicialización del sistema al cargar la página
    inicializarTodo();
  </script>
</body>
</html>
